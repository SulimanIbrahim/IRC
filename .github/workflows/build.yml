name: C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        brew install make gcc

    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/ccache
          **/*.o
        key: ${{ runner.os }}-build-${{ hashFiles('**/*.cpp', '**/*.hpp', 'Makefile') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Build project
      run: make

    - name: Clean
      run: make clean

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ircserve
        path: ircserve
